# ============================================================================
# MeshVTON Inference Configuration
# ============================================================================

# --- Model ---
model:
  # IDM-VTON pre-trained backbone (TryonNet + GarmentNet + VAE + CLIP encoders)
  pretrained_idm_vton: "yisol/IDM-VTON"

  # 3D ControlNet conditioning channels (RGB render + normal map + depth map)
  controlnet_3d_channels: 9

  # Optional: fine-tuned ControlNet3D weights
  controlnet_3d_checkpoint: null

# --- Diffusion Sampling ---
sampling:
  scheduler: "ddim"            # ddpm, ddim, pndm, euler
  num_inference_steps: 50
  guidance_scale: 7.5
  eta: 0.0                     # DDIM eta (0 = deterministic)
  seed: null                   # null for random

# --- Image Settings ---
image:
  resolution: 512
  aspect_ratio: "3:4"          # or "1:1", "auto"
  output_format: "png"

# --- Video Settings ---
video:
  enabled: false
  num_frames: 24
  fps: 8
  temporal_guidance_scale: 2.0
  output_format: "mp4"
  codec: "libx264"

# --- Post-Processing ---
postprocess:
  face_restore: true
  face_restore_model: "codeformer"  # gfpgan, codeformer
  edge_smooth: true
  edge_smooth_kernel: 5
  color_correction: true
  watermark: true               # SynthID watermark

# --- Hardware ---
device: "cuda"
dtype: "float16"               # float16, bfloat16, float32
enable_xformers: true

# --- Output ---
output_dir: "results"
save_intermediate: false       # Save denoising steps
