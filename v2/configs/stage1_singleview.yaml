# Aşama 1 — tek görüş eğitimi (LoRA + zero-init kontrol embedder'ı)
# base.yaml üzerine biner; train_stage1.py okur.

data:
  real_root: v2/data/vitonhd_items      # preprocess_vitonhd.py çıktısı (yoksa sentetik-only, UYARI)
  synth_root: v2/data/synth
  real_ratio: 0.7                       # gerçek:sentetik ≈ 70:30 (domain-gap sigortası)
  batch_size: 2
  num_workers: 2

model:
  lora_rank: 64
  lora_alpha: 64
  ref_dropout: 0.1        # görünüm referansını %10 gri yap → geometri kanalı yük taşımayı öğrenir
  train_guidance: 1.0

train:
  # A100-40GB gerçekçiliği: FLUX 12B + checkpointing'de mikro-adım ~4-6 sn.
  # Efektif batch 8 (bs2 x accum4) + 8k adım ≈ 40-50 saat (resume'la 2-3 oturum).
  # LoRA için standart pratik; 102GB sınıfı GPU bulunursa accum/step artırılabilir.
  max_steps: 8000
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 250
  grad_accum: 4           # efektif batch 8
  max_grad_norm: 1.0
  ckpt_every: 500         # Colab kopması sigortası (Drive'a yazılır)
  log_every: 50
  out_dir: v2/checkpoints/stage1
