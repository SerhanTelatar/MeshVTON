# Aşama 1 — tek görüş eğitimi (LoRA + zero-init kontrol embedder'ı)
# base.yaml üzerine biner; train_stage1.py okur.

data:
  real_root: v2/data/vitonhd_items      # preprocess_vitonhd.py çıktısı (yoksa sentetik-only, UYARI)
  synth_root: v2/data/synth
  real_ratio: 0.7                       # gerçek:sentetik ≈ 70:30 (domain-gap sigortası)
  batch_size: 4                         # A100-80GB'a checkpointing'le rahat sığar
  num_workers: 8                        # PNG çözme GPU'yu bekletmesin (VM 12 vCPU)

model:
  lora_rank: 64
  lora_alpha: 64
  ref_dropout: 0.1        # görünüm referansını %10 gri yap → geometri kanalı yük taşımayı öğrenir
  train_guidance: 1.0
  # compile KAPALI: torch.compile gradient checkpointing'i etkisizleştirip ilk
  # backward'da 80GB'ı taşırdı (OOM, ölçüldü). Hız zaten latent önbelleğinden geliyor.
  compile: false

train:
  # Ölçüldü (A100-80GB): bs2xaccum4 = 21.7s/adım -> 8k adım 48 saat, bütçeye fazla.
  # bs4xaccum1 (efektif 4 — LoRA için standart) + 4k adım ≈ ~10 saat / 1 gece.
  # 4k'da ablation kapısı koşulur; skorlar "daha pişmeli" derse resume'la devam.
  max_steps: 4000
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 200
  grad_accum: 1           # efektif batch 4
  max_grad_norm: 1.0
  ckpt_every: 100         # Drive'a; rotasyon son 2 ckpt'i tutar (kota koruması)
  keep_last: 2
  log_every: 25
  out_dir: v2/checkpoints/stage1
