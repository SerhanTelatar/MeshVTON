# Stage 1 — single-view training (LoRA + the zero-init control embedder)
# Layered on top of base.yaml; read by train_stage1.py.

data:
  real_root: v2/data/vitonhd_items      # preprocess_vitonhd.py output (without it: synthetic-only, WARNING)
  synth_root: v2/data/synth
  real_ratio: 0.7                       # real:synthetic ≈ 70:30 (domain-gap insurance)
  batch_size: 4                         # fits comfortably on an A100-80GB with checkpointing
  num_workers: 8                        # PNG decoding must not stall the GPU (the VM has 12 vCPU)

model:
  lora_rank: 64
  lora_alpha: 64
  ref_dropout: 0.1        # grey out the appearance reference 10% of the time → the geometry channel learns to carry load
  train_guidance: 1.0
  # compile OFF: torch.compile neutralized gradient checkpointing and blew past 80GB on the
  # first backward (OOM, measured). The speed already comes from the latent cache.
  compile: false

train:
  # Measured (A100-80GB): bs2xaccum4 = 21.7s/step -> 8k steps is 48 hours, over budget.
  # bs4xaccum1 (effective 4 — standard for LoRA) + 4k steps ≈ ~10 hours / one night.
  # The ablation gate runs at 4k; if the scores say "needs more cooking", continue with resume.
  max_steps: 4000
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 200
  grad_accum: 1           # effective batch 4
  max_grad_norm: 1.0
  ckpt_every: 100         # to Drive; rotation keeps the last 2 ckpts (quota protection)
  keep_last: 2
  log_every: 25
  out_dir: v2/checkpoints/stage1
