# MeshVTON v2 base config — every script loads this first, the stage configs layer on top.
seed: 42

# THE single, FIXED resolution. No other resolution is used anywhere (the v1 512x384/512x512 duality lesson).
resolution:
  height: 1024
  width: 768

device: cuda

paths:
  data_root: v2/data
  vitonhd_root: v2/data/vitonhd        # raw VITON-HD (train/ test/)
  garments_root: data/garments_3d      # CLOTH3D meshes (shared with v1, read-only)
  synth_root: v2/data/synth
  golden_root: v2/data/golden
  checkpoints: v2/checkpoints
  eval_results: v2/eval_results

model:
  flux_fill_repo: black-forest-labs/FLUX.1-Fill-dev
  flux_kontext_repo: black-forest-labs/FLUX.1-Kontext-dev
  dtype: bfloat16
  prompt: "a person wearing the garment, fashion photography"  # fixed; the text embeddings are precomputed
  lora:
    rank: 64
    alpha: 64
  control:
    # Control images added to x_embedder through zero-init columns (NO RGB — the v1 hallucination lesson):
    images: [normal, depth_sil]
