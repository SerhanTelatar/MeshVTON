# Eval harness config.
golden_manifest: v2/data/golden/manifest.json
angles: [0, 90, 180, 270]

# Prediction file naming contract (inside pred-dir):
#   {person_id}_{garment_id}_{angle:03d}.png
# Optional auxiliary files in the same directory, with the same stem:
#   {stem}.person.png  — the original person photo (for the identity-preservation metrics)
#   {stem}.mask.png    — the inpaint mask (1=garment region)
#   {stem}.sil.png     — the garment silhouette in the conditioning
#   {stem}.ref.png     — the textured appearance reference
#   {stem}.gt.png      — ground truth (only present in the synthetic holdout)
pred_pattern: "{person_id}_{garment_id}_{angle:03d}.png"

# Phase gates (scripts/eval.py compares against these in the report):
thresholds:
  phase2_camera_iou: 0.70          # SMPL-X reprojection vs the parser mask
  phase5_backview_lpips_gain: 0.20 # 180° garment-LPIPS improvement (against Stage 1)
  phase5_delta_e_std: 5.0          # cross-view garment ΔE std
  phase5_frontview_regression: 0.03
